<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abismo Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
  :root{ --ouro:#ffd166; --roxo:#2a1240; --verde:#6cff6a; --texto:#f6efff; --fundo:#07030c; }
  html,body{margin:0;height:100%;background:var(--fundo);overflow:hidden;color:var(--texto);font-family:Nunito,system-ui,sans-serif}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:#0c0618}
  #gl{position:absolute;inset:0;width:1080px;height:1920px;display:block}
  /* TOP 6 em fileira no alto */
  #top6{position:absolute;left:24px;right:24px;top:26px;z-index:5;pointer-events:none}
  #top6 .tit{text-align:center;font-family:'Lilita One',Nunito,sans-serif;font-size:34px;letter-spacing:3px;color:var(--ouro);text-shadow:0 3px 0 #2a0f3a,0 0 18px rgba(255,209,102,.45);margin-bottom:10px}
  #t6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .c6{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:22px;background:rgba(20,8,34,.72);border:2px solid rgba(255,255,255,.12);min-width:0;transition:transform .3s}
  .c6 .av{width:96px;height:96px;border-radius:50%;background:#2e1648 center/cover;border:4px solid #a77bff;position:relative}
  .c6 .pos{position:absolute;left:-8px;top:-8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:900 22px Nunito,sans-serif;background:#3b1d5a;color:#fff;border:2px solid #fff}
  .c6 .n{font:900 24px Nunito,sans-serif;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .c6 .p{font:900 20px Nunito,sans-serif;color:var(--verde)}
  .c6.r1{border-color:var(--ouro);box-shadow:0 0 24px rgba(255,209,102,.5)} .c6.r1 .av{border-color:var(--ouro)} .c6.r1 .pos{background:var(--ouro);color:#3a2600}
  .c6.vazio{opacity:.45} .c6.vazio .av{border-style:dashed;border-color:rgba(255,255,255,.4)}
  .c6.sobe{animation:sobe .7s ease-out}
  @keyframes sobe{30%{transform:scale(1.12)}}
  /* faixa de evento com foto */
  #faixa{position:absolute;left:50%;top:330px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:18px;padding:14px 30px 14px 14px;border-radius:60px;
    background:linear-gradient(90deg,#ff3d8b,#9b3dff);box-shadow:0 10px 40px rgba(0,0,0,.45);border:4px solid #fff;white-space:nowrap;max-width:1000px;opacity:0;pointer-events:none}
  #faixa.on{animation:faixa 3.6s cubic-bezier(.2,.9,.3,1.2) forwards}
  #faixa .av{width:92px;height:92px;border-radius:50%;background:#333 center/cover;border:4px solid #fff;flex:none}
  #faixa .t{font-family:'Lilita One',Nunito,sans-serif;font-size:44px;text-shadow:0 3px 0 rgba(0,0,0,.3);overflow:hidden;text-overflow:ellipsis}
  @keyframes faixa{0%{opacity:0;transform:translateX(-50%) scale(.4)}10%{opacity:1;transform:translateX(-50%) scale(1.08)}16%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}
  /* placa com foto e nome de quem está sendo agradecido, em cima do personagem */
  #placa{position:absolute;z-index:4;left:0;top:0;transform:translate(-50%,-100%);display:none;align-items:center;gap:12px;padding:8px 20px 8px 8px;border-radius:50px;
    background:rgba(255,255,255,.95);color:#2a0f3a;font:900 30px Nunito,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
  #placa.on{display:flex;animation:placa .35s cubic-bezier(.2,.9,.3,1.4)}
  #placa .av{width:64px;height:64px;border-radius:50%;background:#ccc center/cover;border:3px solid #ff3d8b}
  @keyframes placa{from{transform:translate(-50%,-80%) scale(.5);opacity:0}}
  #conn{position:absolute;right:30px;bottom:20px;z-index:6;font:700 18px Nunito,sans-serif;color:rgba(255,255,255,.55)}
  /* modo demonstração (página hospedada) */
  #toque{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(6,2,12,.6);backdrop-filter:blur(3px);cursor:pointer}
  #toque[hidden],#demo-tag[hidden]{display:none}
  #toque .caixa{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 34px;border-radius:28px;background:rgba(20,8,34,.92);border:3px solid var(--ouro);text-align:center;max-width:min(86vw,420px)}
  #toque .t1{font-family:'Lilita One',Nunito,sans-serif;font-size:clamp(24px,7vw,34px);color:var(--ouro)}
  #toque .t2{font-size:clamp(15px,4.2vw,19px);line-height:1.3}
  #toque .bt{margin-top:6px;padding:14px 26px;border-radius:40px;background:var(--verde);color:#0d2a0c;font-weight:900;font-size:clamp(17px,4.6vw,21px)}
  #toque:focus-visible .bt{outline:3px solid #fff;outline-offset:3px}
  #demo-tag{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:6px 14px;border-radius:20px;background:rgba(20,8,34,.8);color:var(--ouro);font:700 13px system-ui,sans-serif;letter-spacing:1px;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="top6"><div class="tit">🏆 TOP 6 DO ABISMO 🏆</div><div id="t6"></div></div>
  <div id="faixa"><div class="av" id="faixa-av"></div><div class="t" id="faixa-t"></div></div>
  <div id="placa"><div class="av" id="placa-av"></div><div id="placa-t"></div></div>
  <div id="conn">conectando…</div>
</div>
<div id="toque" role="button" tabindex="0" hidden>
  <div class="caixa"><div class="t1">🤡 ABISMO LIVE 🐍</div>
    <div class="t2">O Palhaço do Abismo e a Serpente das Trevas com presentes, seguidores e comentários de mentira, como numa live.</div>
    <div class="bt">🔊 Toque para começar</div></div>
</div>
<div id="demo-tag" hidden>MODO DEMONSTRAÇÃO</div>
<script src="falas.js" charset="utf-8"></script>
<script src="demo-local.js" charset="utf-8"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { criarPalhaco, criarSerpente } from './personagens.js';
import { criarMusica } from './musica-abismo.js';
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const stage=document.getElementById('stage');
function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit(); setInterval(fit,1000);

// ---------- cena ----------
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true});
renderer.setSize(1080,1920,false); renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x1a0b2e,26,60);
const camera=new THREE.PerspectiveCamera(42,1080/1920,0.1,200);
camera.position.set(0,10.5,29); camera.lookAt(0,2.2,-1.5);

// céu em degradê (roxo do abismo) + lua + estrelas
{
  const c=document.createElement('canvas'); c.width=4; c.height=512; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512); gr.addColorStop(0,'#05020d'); gr.addColorStop(.45,'#1d0b36'); gr.addColorStop(.75,'#3b1452'); gr.addColorStop(1,'#120720');
  g.fillStyle=gr; g.fillRect(0,0,4,512); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; scene.background=t;
}
const lua=new THREE.Mesh(new THREE.SphereGeometry(3.2,32,24),new THREE.MeshBasicMaterial({color:0xe9ffb0,fog:false}));
lua.position.set(-9,22,-40); scene.add(lua);
const halo=new THREE.Mesh(new THREE.SphereGeometry(4.6,32,24),new THREE.MeshBasicMaterial({color:0xb6ff6a,transparent:true,opacity:.12,fog:false}));
halo.position.copy(lua.position); scene.add(halo);
{
  const n=260, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-.5)*120; pos[i*3+1]=8+Math.random()*50; pos[i*3+2]=-45-Math.random()*20; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.35,fog:false,transparent:true,opacity:.8})));
}
// luzes
scene.add(new THREE.HemisphereLight(0xb79cff,0x2a1030,0.9));
const sol=new THREE.DirectionalLight(0xe9ffd0,1.6); sol.position.set(-8,16,10); sol.castShadow=true;
sol.shadow.mapSize.set(1024,1024); Object.assign(sol.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:50}); scene.add(sol);
const holofote=new THREE.SpotLight(0xff6ad5,40,30,0.55,0.6,1.2); holofote.position.set(6,12,8); holofote.target.position.set(0,0,0); scene.add(holofote,holofote.target);

// ---------- cenário do Abismo ----------
let grad=null;
const toon=(cor,extra={})=>{ if(!grad){ const d=new Uint8Array([70,70,70,255,160,160,160,255,255,255,255,255]); grad=new THREE.DataTexture(d,3,1,THREE.RGBAFormat); grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.needsUpdate=true; }
  return new THREE.MeshToonMaterial({color:cor,gradientMap:grad,...extra}); };
const linhaMat=new THREE.MeshBasicMaterial({color:0x0b0610,side:THREE.BackSide});
function obj(geo,mat,x,y,z,{sx=1,sy=1,sz=1,linha=.05,sombra=true}={}){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.castShadow=sombra; m.receiveShadow=true;
  if(linha){ geo.computeBoundingSphere(); const r=geo.boundingSphere.radius*Math.max(sx,sy,sz); const o=new THREE.Mesh(geo,linhaMat); const k=1+linha/r; o.scale.set(k,k,k); m.add(o); } scene.add(m); return m; }
const ESF=new THREE.SphereGeometry(1,24,16), CIL=new THREE.CylinderGeometry(1,1,1,28), CONE=new THREE.ConeGeometry(1,1,24);

// ilha flutuante: grama roxa por cima, rocha embaixo, borda de pedras
const chaoTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); g.fillStyle='#3b1f5c'; g.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){ g.fillStyle=['#4a2873','#2f1749','#55307f'][i%3]; g.fillRect(Math.random()*256,Math.random()*256,3,6); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t; })();
const ilha=obj(new THREE.CylinderGeometry(11.5,11.5,1,64),toon(0xffffff,{map:chaoTex}),0,-0.5,0,{linha:.08});
obj(new THREE.ConeGeometry(11.4,9,12),toon(0x24122f),0,-5.5,0,{sy:1,linha:.08}).rotation.x=Math.PI;
for(let i=0;i<34;i++){ const a=i/34*Math.PI*2; obj(ESF,toon(i%2?0x4c3a5e:0x3a2b49),Math.sin(a)*11.4,0.05,Math.cos(a)*11.4,{sx:.5,sy:.3,sz:.45,linha:.03}); }
// pedras soltas flutuando no abismo
for(let i=0;i<7;i++){ const a=Math.random()*6.28; const p=obj(ESF,toon(0x2a1b38),Math.sin(a)*(15+Math.random()*6),-3-Math.random()*6,Math.cos(a)*(15+Math.random()*6)-8,{sx:1+Math.random(),sy:.7,sz:1,linha:.04}); p.userData.flutua=Math.random()*6; }

// tenda de circo listrada (fundo)
const listra=(()=>{ const c=document.createElement('canvas'); c.width=256; c.height=64; const g=c.getContext('2d'); for(let i=0;i<12;i++){ g.fillStyle=i%2?'#7a1d6f':'#14081f'; g.fillRect(i*256/12,0,256/12+1,64); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; })();
obj(new THREE.CylinderGeometry(4.2,4.2,3.6,24,1,true),toon(0xffffff,{map:listra,side:THREE.DoubleSide}),0,1.8,-7.5,{linha:0});
obj(new THREE.ConeGeometry(4.8,3.6,24),toon(0xffffff,{map:listra}),0,5.4,-7.5,{linha:.06});
obj(ESF,toon(0x6cff6a),0,7.4,-7.5,{sx:.35,sy:.35,sz:.35,linha:.03});
obj(new THREE.PlaneGeometry(2.4,3),toon(0x080310,{side:THREE.DoubleSide}),0,1.5,-3.29,{linha:0}); // entrada escura
const bandeira=obj(new THREE.PlaneGeometry(1.1,.7),toon(0x6cff6a,{side:THREE.DoubleSide}),0.55,8.2,-7.5,{linha:0}); obj(CIL,toon(0x222222),0,7.8,-7.5,{sx:.05,sy:1.2,sz:.05,linha:0});

// árvores retorcidas
function arvore(x,z,s=1){ const t=obj(CIL,toon(0x2b1a22),x,1.5*s,z,{sx:.35*s,sy:3*s,sz:.35*s,linha:.04}); t.rotation.z=(Math.random()-.5)*.3;
  for(let i=0;i<4;i++) obj(ESF,toon([0x3a1660,0x4d1f7a,0x2a0f45][i%3]),x+(Math.random()-.5)*1.6*s,3.2*s+Math.random()*1.4*s,z+(Math.random()-.5)*1.2*s,{sx:1.1*s,sy:.9*s,sz:1.1*s,linha:.05}); }
arvore(-8.5,-4,1.2); arvore(8.6,-3.5,1.1); arvore(-9.6,2.5,.9); arvore(9.4,3.5,.85);

// postes com lanternas que brilham
const lanternas=[];
for(const [x,z,cor] of [[-6.5,-6,0x6cff6a],[6.5,-6,0xff7ad9],[-9,6.5,0xffb347],[9,6.5,0x7ad9ff]]){
  obj(CIL,toon(0x1d1226),x,1.6,z,{sx:.12,sy:3.2,sz:.12,linha:.02});
  const l=obj(ESF,new THREE.MeshBasicMaterial({color:cor}),x,3.4,z,{sx:.38,sy:.45,sz:.38,linha:.03,sombra:false});
  const luz=new THREE.PointLight(cor,6,9,1.6); luz.position.set(x,3.4,z); scene.add(luz); lanternas.push({l,luz,base:6,f:Math.random()*6});
}
// varal de bandeirinhas entre a tenda e os postes
function varal(a,b,n=10){ const pts=[]; for(let i=0;i<=n;i++){ const t=i/n; pts.push(new THREE.Vector3(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t-Math.sin(t*Math.PI)*.8,a.z+(b.z-a.z)*t)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x111111})));
  for(let i=1;i<n;i++){ const p=pts[i]; const f=new THREE.Mesh(new THREE.ConeGeometry(.22,.45,3),toon([0x6cff6a,0xff4f9a,0xffd166,0x7ad9ff][i%4])); f.position.set(p.x,p.y-.25,p.z); f.rotation.x=Math.PI; scene.add(f); } }
varal(new THREE.Vector3(-4,6.6,-7),new THREE.Vector3(-6.5,3.6,-6)); varal(new THREE.Vector3(4,6.6,-7),new THREE.Vector3(6.5,3.6,-6));

// palco redondo no centro
obj(CIL,toon(0x5a1d4d),0,0.12,1,{sx:3.6,sy:.25,sz:3.6,linha:.05});
obj(CIL,toon(0xffd166),0,0.27,1,{sx:3.3,sy:.06,sz:3.3,linha:0});
// balões soltos no céu
const baloesCeu=[];
for(let i=0;i<6;i++){ const b=obj(ESF,toon([0xff4f9a,0x6cff6a,0xffd166,0x9b5bff,0x7ad9ff,0xff7a59][i]),(Math.random()-.5)*26,6+Math.random()*4,-16-Math.random()*8,{sx:.7,sy:.85,sz:.7,linha:.04}); baloesCeu.push(b); }

// ---------- personagens ----------
const palhaco=criarPalhaco(THREE); scene.add(palhaco.raiz); palhaco.posicionar(-2.4,2.5,0.4);
const serpente=criarSerpente(THREE); scene.add(serpente.raiz); serpente.posicionar(3.2,2.2,-2.6);
const PERS={palhaco,serpente};
// trupe de palhaços doidos que dançam no ritmo da música, em frente à tenda
const CORES_TRUPE=[{roupa:['#ff3d8b','#3a0b2a'],cabelo:0xffd23b,chapeu:0x1d6b4a},{roupa:['#3bd5ff','#0b2a3a'],cabelo:0xff6a3d,chapeu:0x7a1d6f},
  {roupa:['#ffd23b','#3a2a0b'],cabelo:0x9b5bff,chapeu:0xd8233a},{roupa:['#6cff6a','#0b3a12'],cabelo:0xff3d8b,chapeu:0x2a1240},{roupa:['#ff7a3d','#3a160b'],cabelo:0x3bd5ff,chapeu:0x5b2a86}];
const trupe=CORES_TRUPE.map((c,i)=>{ const p=criarPalhaco(THREE,c); const k=.58; p.raiz.scale.set(k,k,k); scene.add(p.raiz);
  const x=-6.4+i*3.2, z=-3.6+Math.abs(i-2)*.5; p.posicionar(x,z,Math.atan2(-x*.2,1)); p.defFase(i*.37); p.casa={x,z}; return p; });
const sombra=o=>o.traverse(m=>{ if(m.isMesh) m.castShadow=true; }); [palhaco,serpente,...trupe].forEach(p=>sombra(p.raiz));
window.__abismo={palhaco,serpente,trupe,THREE,scene,camera};

// andam sozinhos pelo cenário (área da frente, onde aparecem bem)
const AREA={x:7.2,zMin:-2,zMax:7.5};
function passear(p){ if(!p.estado.alvo&&!p.ocupado()&&Math.random()<.012) p.andarPara((Math.random()*2-1)*AREA.x, AREA.zMin+Math.random()*(AREA.zMax-AREA.zMin)); }

// ---------- música ----------
let falaAtual=null;
const musica=criarMusica({falando:()=>!!falaAtual});

// ---------- partículas: confete, corações, explosões, fogos ----------
const PART_N=900, ppos=new Float32Array(PART_N*3), pcor=new Float32Array(PART_N*3), pvel=[], pvida=new Float32Array(PART_N); let pIdx=0;
const pgeo=new THREE.BufferGeometry(); pgeo.setAttribute('position',new THREE.BufferAttribute(ppos,3)); pgeo.setAttribute('color',new THREE.BufferAttribute(pcor,3));
for(let i=0;i<PART_N;i++){ pvel.push(new THREE.Vector3()); ppos[i*3+1]=-999; }
const pts=new THREE.Points(pgeo,new THREE.PointsMaterial({size:.32,vertexColors:true,transparent:true,depthWrite:false,fog:false})); scene.add(pts);
const tmpC=new THREE.Color();
function soltar(n,pos,{vel=6,cima=4,cores=[0xff3d8b,0x6cff6a,0xffd23b,0x3bd5ff,0x9b5bff],vida=1.6,grav=9}={}){
  for(let k=0;k<n;k++){ const i=pIdx=(pIdx+1)%PART_N; ppos[i*3]=pos.x; ppos[i*3+1]=pos.y; ppos[i*3+2]=pos.z;
    const a=Math.random()*6.28, e=Math.random()*vel; pvel[i].set(Math.cos(a)*e,cima+Math.random()*cima,Math.sin(a)*e); pvel[i].grav=grav;
    tmpC.set(cores[k%cores.length]); pcor[i*3]=tmpC.r; pcor[i*3+1]=tmpC.g; pcor[i*3+2]=tmpC.b; pvida[i]=vida*(.6+Math.random()*.6); } }
function fogos(n=3){ for(let i=0;i<n;i++) setTimeout(()=>{ const p=new THREE.Vector3((Math.random()-.5)*16,12+Math.random()*5,-6-Math.random()*6);
  soltar(70,p,{vel:7,cima:0,vida:1.4,grav:2,cores:[[0xff3d8b,0xffd23b],[0x6cff6a,0x3bd5ff],[0x9b5bff,0xffffff]][i%3]}); },i*380); }
function coracoes(n){ soltar(n,new THREE.Vector3((Math.random()-.5)*10,0.5,6),{vel:1.2,cima:5,cores:[0xff3d6b,0xff7aa2],vida:1.4,grav:-1}); }
function atualizarParticulas(dt){ for(let i=0;i<PART_N;i++){ if(pvida[i]<=0){ if(ppos[i*3+1]>-900) ppos[i*3+1]=-999; continue; }
  pvida[i]-=dt; const v=pvel[i]; v.y-=v.grav*dt; ppos[i*3]+=v.x*dt; ppos[i*3+1]+=v.y*dt; ppos[i*3+2]+=v.z*dt; }
  pgeo.attributes.position.needsUpdate=true; pgeo.attributes.color.needsUpdate=true; }

// ---------- câmera drone ----------
const cam={pos:camera.position.clone(),olha:new THREE.Vector3(0,2.2,-1.5),foco:null,ate:0,tremor:0};
function focar(p,ms=4000){ cam.foco=p; cam.ate=performance.now()+ms; }
function atualizarCamera(dt,t){
  let alvoPos, alvoOlha;
  if(cam.foco&&performance.now()<cam.ate){
    const c=cam.foco.cabecaMundo(new THREE.Vector3()); const base=cam.foco.tipo==='serpente'?c.clone().setY(c.y*.6):c.clone().setY(c.y-1.2);
    const lado=Math.sin(t*.25)*4;
    alvoPos=new THREE.Vector3(base.x*.6+lado,base.y+4.2+(cam.foco.estado.voo||0)*3,base.z+15);
    alvoOlha=new THREE.Vector3(base.x,base.y+.4+(cam.foco.estado.voo||0)*3,base.z);
  } else {
    cam.foco=null;
    const ang=Math.sin(t*.06)*.42, raio=29+Math.sin(t*.045)*3.5, alt=10.5+Math.sin(t*.08)*2.2;
    alvoPos=new THREE.Vector3(Math.sin(ang)*raio,alt,Math.cos(ang)*raio-1.5); alvoOlha=new THREE.Vector3(Math.sin(t*.11)*1.5,2.2,-1.5);
  }
  const k=Math.min(1,dt*1.6); cam.pos.lerp(alvoPos,k); cam.olha.lerp(alvoOlha,k);
  camera.position.copy(cam.pos); if(cam.tremor>0){ cam.tremor-=dt; camera.position.x+=(Math.random()-.5)*cam.tremor*.8; camera.position.y+=(Math.random()-.5)*cam.tremor*.8; }
  camera.lookAt(cam.olha);
}

// ---------- TOP 6 ----------
let t6ant=new Map();
function renderTop6(top){ let h=''; for(let i=0;i<6;i++){ const u=top[i];
  if(!u){ h+=`<div class="c6 vazio"><div class="av"><div class="pos">${i+1}</div></div><div class="n">—</div><div class="p">0</div></div>`; continue; }
  const sobe=(t6ant.get(u.id)??99)>i;
  h+=`<div class="c6 r${i+1}${sobe?' sobe':''}"><div class="av" style="${u.avatar?`background-image:url('${esc(u.avatar)}')`:''}"><div class="pos">${i+1}</div></div><div class="n">${esc(u.name)}</div><div class="p">${Math.round(u.pts).toLocaleString('pt-BR')}</div></div>`; }
  $('t6').innerHTML=h; t6ant=new Map(top.map((u,i)=>[u.id,i])); }
renderTop6([]);

// ---------- faixa de evento ----------
const faixaQ=[]; let faixaAte=0;
function faixa(texto,user,cor){ faixaQ.push({texto,user,cor}); if(faixaQ.length>4) faixaQ.shift(); }
function rodarFaixa(){ if(performance.now()<faixaAte||!faixaQ.length) return; const f=faixaQ.shift(); const el=$('faixa');
  $('faixa-t').textContent=f.texto; $('faixa-av').style.display=f.user&&f.user.avatar?'':'none'; $('faixa-av').style.backgroundImage=f.user&&f.user.avatar?`url('${f.user.avatar}')`:'';
  el.style.background=f.cor||''; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); faixaAte=performance.now()+2600; }

// ---------- falas (voz do servidor; boca mexe conforme o volume) ----------
let acFala=null, analisador=null; const buf=new Uint8Array(256);
// vozes sombrias: tom mais grave (toca mais devagar sem corrigir o tom) + eco de circo abandonado
// voz limpa: o tom grave já vem pronto do servidor (painel > Vozes); sem câmera lenta, eco ou reverberação, que davam chiado
const SOMBRIO={palhaco:{vel:1,eco:0,rev:0},serpente:{vel:1,eco:0,rev:0},espectador:{vel:1,eco:0,rev:0}};
let efeitoEntrada=null;
function montarEfeitos(){
  const ac=acFala; analisador=ac.createAnalyser(); analisador.fftSize=512; analisador.connect(ac.destination);
  efeitoEntrada=ac.createGain();
  const seco=ac.createGain(); seco.gain.value=1; efeitoEntrada.connect(seco); seco.connect(analisador);
  // eco
  const atraso=ac.createDelay(1); atraso.delayTime.value=.19; const volta=ac.createGain(); volta.gain.value=.32; const ecoG=ac.createGain(); ecoG.gain.value=.35;
  efeitoEntrada.connect(atraso); atraso.connect(volta); volta.connect(atraso); atraso.connect(ecoG); ecoG.connect(analisador);
  // reverberação (sala grande e escura)
  const conv=ac.createConvolver(); const n=Math.floor(ac.sampleRate*2.4); const ir=ac.createBuffer(2,n,ac.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); }
  conv.buffer=ir; const revG=ac.createGain(); revG.gain.value=.45; efeitoEntrada.connect(conv); conv.connect(revG); revG.connect(analisador);
  efeitoEntrada.ecoG=ecoG; efeitoEntrada.revG=revG;
}
function ligarAnalisador(audio,quem){ try{ if(!acFala){ acFala=new (window.AudioContext||window.webkitAudioContext)(); montarEfeitos(); }
  if(acFala.state==='suspended') acFala.resume().catch(()=>{});
  const f=SOMBRIO[quem]||SOMBRIO.palhaco; efeitoEntrada.ecoG.gain.value=f.eco; efeitoEntrada.revG.gain.value=f.rev;
  const src=acFala.createMediaElementSource(audio); src.connect(efeitoEntrada); return true; }catch(e){ return false; } }
function nivelVoz(){ if(!analisador) return 0; analisador.getByteTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; s+=v*v; } return Math.min(1,Math.sqrt(s/buf.length)*5); }
const falaQ=[];
function falar(m){ falaQ.push(m); if(falaQ.length>8) falaQ.shift(); if(!falaAtual) proximaFala(); }
function fimFala(){ const m=falaAtual; if(!m) return; falaAtual=null; clearTimeout(m._t); $('placa').classList.remove('on'); for(const p of Object.values(PERS)) p.falar(0);
  try{ if(window.__ws&&window.__ws.readyState===1) window.__ws.send(JSON.stringify({type:'falou',id:m.id})); }catch(e){}
  setTimeout(()=>{ if(!falaAtual) proximaFala(); },250); }
function proximaFala(){
  const m=falaQ.shift(); if(!m) return; falaAtual=m; m._t=setTimeout(fimFala,(m.ms||5000)+8000);
  const partes=m.partes&&m.partes.length?m.partes:[{quem:'palhaco',texto:m.text,url:m.url||null,acao:null}];
  if(m.user){ $('placa-t').textContent=m.user.name; $('placa-av').style.display=m.user.avatar?'':'none'; $('placa-av').style.backgroundImage=m.user.avatar?`url('${m.user.avatar}')`:''; }
  let k=0;
  const tocarParte=()=>{ if(falaAtual!==m) return; if(k>=partes.length) return fimFala(); const pa=partes[k++];
    const P=pa.quem==='espectador'?null:(PERS[pa.quem]||palhaco); // espectador lendo o próprio comentário: nenhum personagem mexe a boca
    m.quem=P; if(P&&pa.acao) P.acao(pa.acao); if(pa.acao==='cantar'){ musica.cantoria(true); trupe.forEach(d=>d.acao('dancar',8)); }
    if(P){ focar(P,9000); if(m.user) $('placa').classList.add('on'); }
    const fim=()=>{ musica.cantoria(false); if(P) P.falar(0); tocarParte(); };
    if(pa.url){ const a=new Audio(pa.url); a.crossOrigin='anonymous'; const sb=SOMBRIO[pa.quem]||SOMBRIO.palhaco; a.preservesPitch=false; a.mozPreservesPitch=false; a.webkitPreservesPitch=false; a.playbackRate=sb.vel; m.audio=a; m.analisa=ligarAnalisador(a,pa.quem); a.onended=fim; a.onerror=fim; a.play().catch(()=>setTimeout(fim,1500)); }
    else falarNavegador(pa.texto,pa.quem,fim,m);
  };
  tocarParte();
}
function falarNavegador(texto,quem,fim,m){ m.analisa=false; m.simula=true;
  try{ const ss=window.speechSynthesis; const vs=ss?ss.getVoices().filter(v=>/^pt/i.test(v.lang)):[]; if(!ss||!vs.length) return setTimeout(fim,900+texto.length*60);
    const u=new SpeechSynthesisUtterance(texto.replace(/(^|\s)s{3,}[.…!]*/gi,'$1').replace(/s{3,}/gi,'s')); u.lang='pt-BR'; u.voice=vs.find(v=>/BR/i.test(v.lang))||vs[0];
    u.pitch=quem==='serpente'?.7:.8; u.rate=1; let ok=false; u.onend=()=>{ ok=true; fim(); }; u.onerror=()=>{ if(!ok) setTimeout(fim,600); };
    ss.speak(u); setTimeout(()=>{ if(!ok&&!ss.speaking) fim(); },900+texto.length*90); }catch(e){ setTimeout(fim,1500); } }

// ---------- eventos da live ----------
const cabecaDe=p=>p.cabecaMundo(new THREE.Vector3());
function onGift(e){ const u=e.user, total=e.coins||1; musica.evento('presente',total,e.giftName);
  faixa(`${u.name} mandou ${e.count>1?e.count+'x ':''}${e.giftName||'presente'}`,u);
  soltar(Math.min(160,20+total*4),cabecaDe(palhaco),{vel:5,cima:5});
  trupe.forEach((d,i)=>setTimeout(()=>d.acao('pular'),i*90));
  if(total>=100) fogos(5); else if(total>=30) fogos(2);
  if(e.cantoria){ try{ const a=new Audio(e.cantoria); a.volume=.95; musica.cantoria(true); a.onended=a.onerror=()=>musica.cantoria(false); setTimeout(()=>{ try{a.pause();}catch(x){} musica.cantoria(false); },20000); a.play().catch(()=>musica.cantoria(false)); }catch(x){} } }
function onBomb(e){ musica.evento('bomba'); faixa(`💣 ${e.user.name} mandou ${e.giftName||'bomba'}!`,e.user,'linear-gradient(90deg,#ff5e2b,#7a0b0b)');
  soltar(160,cabecaDe(serpente),{vel:9,cima:6,cores:[0xff5e2b,0xffd23b,0x333333],vida:1.2}); cam.tremor=.8; serpente.acao('susto'); }
function onFollow(e){ musica.evento('seguiu'); faixa(`➕ ${e.user.name} seguiu!`,e.user,'linear-gradient(90deg,#3bd5ff,#6c3dff)'); soltar(90,cabecaDe(palhaco),{vel:4,cima:6}); }
function onShare(e){ musica.evento('seguiu'); faixa(`🔁 ${e.user.name} compartilhou!`,e.user,'linear-gradient(90deg,#ffb23b,#ff3d8b)'); soltar(60,cabecaDe(palhaco)); }
function onLike(e){ musica.evento('curtida'); musica.esquentar(Math.min(.05,(e.likes||1)*.002)); coracoes(Math.min(30,2+(e.likes||1))); }
function handle(m){
  switch(m.type){
    case 'gift': onGift(m); break; case 'bomb': onBomb(m); break; case 'follow': onFollow(m); break; case 'share': onShare(m); break;
    case 'like': onLike(m); break; case 'chat': musica.evento('comentario'); break;
    case 'rank': renderTop6(m.top||[]); break; case 'say': falar(m); break;
    case 'snapshot': renderTop6(m.rank||[]); setConn(m.tiktok); musica.config(m.musica); break; case 'tiktok': setConn(m); break;
    case 'config': musica.config(m.musica); break;
  }
}
function setConn(t){ if(!t) return; $('conn').textContent=t.connected?`AO VIVO @${t.username}`:(t.username?`aguardando a live de @${t.username}…`:'modo teste'); }
(function connect(){ if(window.__demoLocal&&window.__demoLocal.ativo) return;
  let ws; try{ ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host); }catch(e){ return; } window.__ws=ws;
  ws.onmessage=ev=>{ try{ handle(JSON.parse(ev.data)); }catch(e){} };
  ws.onclose=()=>{ if(!(window.__demoLocal&&window.__demoLocal.ativo)) setTimeout(connect,2000); }; })();

// ---------- teste: teclas e eventos falsos ----------
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const NOMES=['Lisa','Marco','Juliana','Pedrinho','Bia_Gamer','Thiagão','Carol','Rafa','Dudu','Mari'];
function fakeUser(){ const n=rnd(NOMES); const L=window.__demoLocal; return {id:n.toLowerCase(),name:n,avatar:L&&L.ativo?L.foto(n):`https://api.dicebear.com/9.x/thumbs/png?seed=${n}&size=96`}; }
const local=ev=>window.__demoLocal&&window.__demoLocal.ativo?window.__demoLocal.processar(ev,handle):handle(ev);
function sim(ev){ if(window.__demoLocal&&window.__demoLocal.ativo) return local(ev); const u=ev.user;
  fetch('/api/sim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:ev.type==='bomb'?'gift':ev.type,id:u.id,name:u.name,avatar:u.avatar,
    giftName:ev.giftName,diamonds:ev.diamonds,count:ev.count,likes:ev.likes,text:ev.text})}).then(r=>{ if(!r.ok) local(ev); }).catch(()=>local(ev)); }
const FALAS_TESTE=['oi palhaço','serpente linda','kkkkkkk','dança palhaço','boa noite galera','que medo kkk','canta uma música','como faz pra aparecer no ranking?','salve salve'];
function fakeGift(){ const g=rnd([['Rose',1],['Rose',1],['Rose',1],['Finger Heart',5],['Donut',30],['Hand Hearts',100],['Galaxy',1000]]); const count=g[1]===1?1+Math.floor(Math.random()*6):1;
  sim({type:'gift',user:fakeUser(),giftName:g[0],diamonds:g[1],count}); }
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='g') fakeGift(); else if(k==='b') sim({type:'gift',user:fakeUser(),giftName:'GG',diamonds:1,count:3}); else if(k==='f') sim({type:'follow',user:fakeUser()});
  else if(k==='s') sim({type:'share',user:fakeUser()}); else if(k==='l') sim({type:'like',user:fakeUser(),likes:5+Math.floor(Math.random()*20)});
  else if(k==='c') sim({type:'chat',user:fakeUser(),text:rnd(FALAS_TESTE)}); else if(k==='j') sim({type:'join',user:fakeUser()}); });
let demoRodando=false;
function iniciarDemo(){ if(demoRodando) return; demoRodando=true;
  (function tick(){ const r=Math.random();
    if(r<.22) fakeGift(); else if(r<.25) sim({type:'gift',user:fakeUser(),giftName:'GG',diamonds:1,count:2}); else if(r<.35) sim({type:'follow',user:fakeUser()});
    else if(r<.4) sim({type:'share',user:fakeUser()}); else if(r<.62) sim({type:'like',user:fakeUser(),likes:3+Math.floor(Math.random()*20)});
    else if(r<.8) sim({type:'chat',user:fakeUser(),text:rnd(FALAS_TESTE)}); else sim({type:'join',user:fakeUser()});
    setTimeout(tick,1600+Math.random()*2600); })(); }
if(new URLSearchParams(location.search).get('demo')==='1') iniciarDemo();
// página hospedada (sem o servidor): modo demonstração local
fetch('api/status',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{ if(!j||typeof j!=='object') throw 0; }).catch(()=>{
  if(!window.__demoLocal) return; window.__demoLocal.ativo=true; window.__demoLocal.modo='abismo'; try{ window.__ws&&window.__ws.close(); }catch(e){}
  $('conn').style.display='none'; $('demo-tag').hidden=false; const t=$('toque'); t.hidden=false;
  const comecar=()=>{ if(t.hidden) return; t.hidden=true; musica.ligar();
    try{ const ss=window.speechSynthesis; if(ss){ const u=new SpeechSynthesisUtterance('Bora!'); u.lang='pt-BR'; u.volume=.01; ss.speak(u); } }catch(e){}
    iniciarDemo(); };
  t.addEventListener('click',comecar); t.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') comecar(); });
});
musica.ligar(); addEventListener('pointerdown',()=>musica.ligar()); setTimeout(()=>musica.ligar(),1500);

// ---------- laço ----------
const relogio=new THREE.Clock(); let tBatida=0;
const vTmp=new THREE.Vector3();
function loop(){
  const dt=Math.min(.05,relogio.getDelta()), t=relogio.elapsedTime;
  // quem está falando para de andar e olha pra câmera; os outros passeiam
  const falante=falaAtual&&falaAtual.quem;
  for(const p of [palhaco,serpente]){ if(p===falante) p.encarar(new THREE.Vector3(camera.position.x,0,camera.position.z)); else { if(p.estado.encarar) p.encarar(null); passear(p); } }
  // boca: volume real da voz, ou "mexe" sozinha quando a voz é a do navegador
  if(falaAtual&&falaAtual.quem){ const nv=falaAtual.analisa?nivelVoz():(falaAtual.simula?(.35+Math.abs(Math.sin(t*14))*.5):0); falaAtual.quem.falar(nv); }
  palhaco.atualizar(dt,t); serpente.atualizar(dt,t);
  // trupe: dança no ritmo da música (uma pulada por batida)
  const bt=musica.batida(); tBatida+=dt*bt.porSeg*Math.PI/7;
  for(const d of trupe){ if(!d.ocupado()) d.acao('dancar',4); d.atualizar(dt,tBatida); }
  for(const L of lanternas){ L.luz.intensity=L.base*(.75+Math.sin(t*3+L.f)*.15+bt.energia*.3); }
  holofote.position.x=Math.sin(t*.7)*8; holofote.color.setHSL((t*.05)%1,.8,.6);
  baloesCeu.forEach((b,i)=>{ b.position.y+=Math.sin(t+i)*.004; b.position.x+=Math.cos(t*.3+i)*.004; });
  bandeira.rotation.y=Math.sin(t*3)*.4;
  atualizarParticulas(dt); atualizarCamera(dt,t); rodarFaixa();
  // placa com foto acompanha quem está falando
  if(falaAtual&&falaAtual.quem&&falaAtual.user){ vTmp.copy(falaAtual.quem.cabecaMundo(vTmp)).project(camera); const pl=$('placa');
    pl.style.left=Math.max(200,Math.min(880,(vTmp.x*.5+.5)*1080))+'px'; pl.style.top=Math.max(560,(-vTmp.y*.5+.5)*1920-20)+'px'; }
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
loop();
// teste: ?acao=rir faz os dois executarem uma ação
const qa=new URLSearchParams(location.search).get('acao'); if(qa) setTimeout(()=>{ palhaco.acao(qa); serpente.acao(qa==='voar'?'dancar':qa); },300);
